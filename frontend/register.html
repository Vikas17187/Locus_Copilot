<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Locus Copilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (t === 'dark' || (!t && prefersDark)) {
        document.documentElement.classList.add('dark-theme');
      } else {
        document.documentElement.classList.remove('dark-theme');
      }
    })();
  </script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--color-sheet);
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
    }
    .auth-header-bar {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .auth-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-panel);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-md);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--color-ink);
      text-decoration: none;
      margin-bottom: 1.5rem;
    }
    .auth-brand svg {
      width: 28px;
      height: 28px;
      color: var(--color-primary);
    }
    .auth-title {
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .auth-sub {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-bottom: 1.75rem;
    }
    .auth-status {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-control);
      font-size: var(--text-sm);
      margin-bottom: 1.25rem;
      display: none;
    }
    .auth-status.error {
      background: var(--color-error-subtle);
      border: 1px solid var(--color-error);
      color: var(--color-error);
      display: block;
    }
    .auth-status.success {
      background: var(--color-success-subtle);
      border: 1px solid var(--color-success);
      color: var(--color-success);
      display: block;
    }
  </style>
</head>
<body>
  <div class="auth-header-bar">
    <a href="index.html" class="btn btn-ghost btn-sm" aria-label="Return to home page">
      &larr; Back to Home
    </a>
    <button type="button" class="theme-switch-pill" id="themeToggleBtn" onclick="Theme.toggleTheme()" aria-label="Toggle theme" title="Toggle between Obsidian Glass and Executive Class">
      <span class="theme-pill-dot"></span>
      <span class="theme-pill-text">Obsidian Glass</span>
    </button>
  </div>

  <main class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="auth-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2a10 10 0 0 1 10 10c0 5.25-7 10-10 10S2 17.25 2 12A10 10 0 0 1 12 2z"/>
        </svg>
        <span>Locus <span style="color:var(--color-primary)">Copilot</span></span>
      </a>

      <h1 class="auth-title">Create an Account</h1>
      <p class="auth-sub">Save your criteria weights, favorite spots, and custom notes.</p>

      <div id="statusMsg" class="auth-status" role="alert" aria-live="polite"></div>

      <form id="registerForm" onsubmit="handleRegister(event)" novalidate>
        <div class="form-group">
          <label class="form-label" for="fullNameInput">Full Name</label>
          <input
            type="text"
            id="fullNameInput"
            name="full_name"
            class="form-control"
            placeholder="e.g. Ramesh Kumar"
            required
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="emailInput">Email Address</label>
          <input
            type="email"
            id="emailInput"
            name="email"
            class="form-control"
            placeholder="you@company.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">Password (6–16 characters)</label>
          <div class="password-field-wrapper">
            <input
              type="password"
              id="passwordInput"
              name="password"
              class="form-control"
              placeholder="Create a password"
              required
              minlength="6"
              maxlength="16"
              autocomplete="new-password"
            >
            <button
              type="button"
              class="password-toggle-btn"
              onclick="togglePasswordVisibility('passwordInput', this)"
              aria-label="Show password"
              title="Show password"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPasswordInput">Confirm Password</label>
          <div class="password-field-wrapper">
            <input
              type="password"
              id="confirmPasswordInput"
              name="confirmPassword"
              class="form-control"
              placeholder="Repeat your password"
              required
              minlength="6"
              maxlength="16"
              autocomplete="new-password"
            >
            <button
              type="button"
              class="password-toggle-btn"
              onclick="togglePasswordVisibility('confirmPasswordInput', this)"
              aria-label="Show password"
              title="Show password"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn" style="margin-top:0.75rem;">
          Create Account
        </button>
      </form>

      <p style="font-size:var(--text-sm);color:var(--color-text-secondary);text-align:center;margin-top:1.5rem;">
        Already have an account? <a href="login.html" style="color:var(--color-primary);font-weight:600;">Sign in</a>
      </p>
    </div>
  </main>

  <script src="js/dom.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      btn.title = isPassword ? 'Hide password' : 'Show password';
      btn.innerHTML = isPassword
        ? '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }

    function showStatus(message, type = 'error') {
      const el = document.getElementById('statusMsg');
      el.textContent = message;
      el.className = `auth-status ${type}`;
    }

    function clearStatus() {
      const el = document.getElementById('statusMsg');
      el.className = 'auth-status';
      el.textContent = '';
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearStatus();

      const fullName = document.getElementById('fullNameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const confirm = document.getElementById('confirmPasswordInput').value;
      const btn = document.getElementById('submitBtn');

      if (!fullName) {
        showStatus('Please enter your full name.', 'error');
        return;
      }

      if (!email || !email.includes('@')) {
        showStatus('Please enter a valid email address.', 'error');
        return;
      }

      if (password.length < 6 || password.length > 16) {
        showStatus('Password must be between 6 and 16 characters.', 'error');
        return;
      }

      if (password !== confirm) {
        showStatus('Passwords do not match.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const data = await API.fetch('/auth/register', {
          method: 'POST',
          body: {
            email: email,
            password: password,
            full_name: fullName
          }
        });

        if (data && data.success) {
          showStatus('Account created successfully! Redirecting to sign in...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 900);
        } else {
          showStatus(data.detail || 'Registration failed. Please try a different email.', 'error');
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      } catch (err) {
        showStatus(err.message || 'Registration failed.', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
